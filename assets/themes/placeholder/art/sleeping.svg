<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Placeholder pet, sleeping">
  <title>Placeholder pet, sleeping</title>
  <style>
    .blob{transform-box:fill-box;transform-origin:50% 92%}
    .tip{transform-box:fill-box;transform-origin:50% 100%}
    .blob{animation:sleep 4.5s ease-in-out infinite}
     .zzz text{animation:float 3.6s ease-in-out infinite}
     @keyframes sleep{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
     @keyframes float{0%{opacity:0;transform:translateY(2px)}30%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
  </style>
  <g class="blob" >
    <ellipse cx="32" cy="56" rx="15" ry="3.2" fill="#1b1430" opacity=".22"/>
    <rect x="14" y="16" width="36" height="36" rx="15" fill="#8b6cf0"/>
    <rect x="14" y="30" width="36" height="22" rx="15" fill="#6d4fd6" opacity=".35"/>
    <rect x="23" y="34" width="18" height="13" rx="6.5" fill="#ffffff" opacity=".2"/>
    <path d="M22 32 q3 3 6 0" stroke="#241a3d" stroke-width="1.6" fill="none" stroke-linecap="round"/>
              <path d="M36 32 q3 3 6 0" stroke="#241a3d" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M30 40 q2 2 4 0" stroke="#241a3d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <line x1="32" y1="16" x2="32" y2="9" stroke="#241a3d" stroke-width="1.6" stroke-linecap="round"/>
    <circle class="tip" cx="32" cy="7.5" r="2.6" fill="#ffd166"/>
    <g class="zzz" fill="#cfd6ff" font-family="monospace" font-size="9">
        <text x="47" y="16">z</text><text x="53" y="10" font-size="7">z</text>
      </g>
  </g>
</svg>
