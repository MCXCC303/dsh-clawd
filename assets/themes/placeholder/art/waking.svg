<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Placeholder pet, waking up">
  <title>Placeholder pet, waking up</title>
  <style>
    .blob{transform-box:fill-box;transform-origin:50% 92%}
    .tip{transform-box:fill-box;transform-origin:50% 100%}
    .blob{animation:rise 1.5s ease-out both}
     @keyframes rise{0%{transform:scale(1.1,.85) translateY(6px)}60%{transform:scale(.98,1.04)}100%{transform:scale(1,1)}}
  </style>
  <g class="blob" >
    <ellipse cx="32" cy="56" rx="15" ry="3.2" fill="#1b1430" opacity=".22"/>
    <rect x="14" y="16" width="36" height="36" rx="15" fill="#8b6cf0"/>
    <rect x="14" y="30" width="36" height="22" rx="15" fill="#6d4fd6" opacity=".35"/>
    <rect x="23" y="34" width="18" height="13" rx="6.5" fill="#ffffff" opacity=".2"/>
    <circle cx="25" cy="32" r="3.6" fill="#fff"/><circle cx="39" cy="32" r="3.6" fill="#fff"/>
              <circle cx="25" cy="32" r="1.8" fill="#241a3d"/><circle cx="39" cy="32" r="1.8" fill="#241a3d"/>
    <ellipse cx="32" cy="41" rx="4.5" ry="5" fill="#241a3d" opacity=".85"/>
    <line x1="32" y1="16" x2="32" y2="9" stroke="#241a3d" stroke-width="1.6" stroke-linecap="round"/>
    <circle class="tip" cx="32" cy="7.5" r="2.6" fill="#ffd166"/>
    
  </g>
</svg>
