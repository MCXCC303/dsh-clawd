<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Placeholder pet, done">
  <title>Placeholder pet, done</title>
  <style>
    .blob{transform-box:fill-box;transform-origin:50% 92%}
    .tip{transform-box:fill-box;transform-origin:50% 100%}
    .blob{animation:jump .9s ease-in-out infinite}
     .spark{transform-box:fill-box;transform-origin:50% 50%;animation:spin 2.4s linear infinite}
     @keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-6px) scale(.97,1.05)}}
     @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <g class="blob" >
    <ellipse cx="32" cy="56" rx="15" ry="3.2" fill="#1b1430" opacity=".22"/>
    <rect x="14" y="16" width="36" height="36" rx="15" fill="#8b6cf0"/>
    <rect x="14" y="30" width="36" height="22" rx="15" fill="#6d4fd6" opacity=".35"/>
    <rect x="23" y="34" width="18" height="13" rx="6.5" fill="#ffffff" opacity=".2"/>
    <path d="M22 33 q3 -4 6 0" stroke="#241a3d" stroke-width="1.8" fill="none" stroke-linecap="round"/>
              <path d="M36 33 q3 -4 6 0" stroke="#241a3d" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M30 40 q2 2 4 0" stroke="#241a3d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <line x1="32" y1="16" x2="32" y2="9" stroke="#241a3d" stroke-width="1.6" stroke-linecap="round"/>
    <circle class="tip" cx="32" cy="7.5" r="2.6" fill="#ffd166"/>
    <g class="spark" fill="#ffe08a">
        <path d="M52 14 l1.6 3.4 3.4 1.6 -3.4 1.6 -1.6 3.4 -1.6 -3.4 -3.4 -1.6 3.4 -1.6z"/>
      </g>
  </g>
</svg>
