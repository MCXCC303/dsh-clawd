<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Placeholder pet, compacting">
  <title>Placeholder pet, compacting</title>
  <style>
    .blob{transform-box:fill-box;transform-origin:50% 92%}
    .tip{transform-box:fill-box;transform-origin:50% 100%}
    .blob{animation:sweep 1.8s ease-in-out infinite}
     .broom{transform-box:fill-box;transform-origin:90% 10%;animation:brush 1.8s ease-in-out infinite}
     @keyframes sweep{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
     @keyframes brush{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
  </style>
  <g class="blob" >
    <ellipse cx="32" cy="56" rx="15" ry="3.2" fill="#1b1430" opacity=".22"/>
    <rect x="14" y="16" width="36" height="36" rx="15" fill="#8b6cf0"/>
    <rect x="14" y="30" width="36" height="22" rx="15" fill="#6d4fd6" opacity=".35"/>
    <rect x="23" y="34" width="18" height="13" rx="6.5" fill="#ffffff" opacity=".2"/>
    <path d="M22 31 h6" stroke="#241a3d" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M36 31 h6" stroke="#241a3d" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="25" cy="34" r="2" fill="#241a3d"/>
              <circle cx="39" cy="34" r="2" fill="#241a3d"/>
    <path d="M29 41 h6" stroke="#241a3d" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32" y1="16" x2="32" y2="9" stroke="#241a3d" stroke-width="1.6" stroke-linecap="round"/>
    <circle class="tip" cx="32" cy="7.5" r="2.6" fill="#ffd166"/>
    <g class="broom"><line x1="44" y1="18" x2="56" y2="40" stroke="#c9a227" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M52 38 l8 4 -6 6 -6 -6z" fill="#e0b84a"/></g>
  </g>
</svg>
