<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Placeholder pet, carrying">
  <title>Placeholder pet, carrying</title>
  <style>
    .blob{transform-box:fill-box;transform-origin:50% 92%}
    .tip{transform-box:fill-box;transform-origin:50% 100%}
    .blob{animation:walk 1s ease-in-out infinite}
     .box{transform-box:fill-box;transform-origin:50% 100%;animation:shift 1s ease-in-out infinite}
     @keyframes walk{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-2px) rotate(1.5deg)}}
     @keyframes shift{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  </style>
  <g class="blob" >
    <ellipse cx="32" cy="56" rx="15" ry="3.2" fill="#1b1430" opacity=".22"/>
    <rect x="14" y="16" width="36" height="36" rx="15" fill="#8b6cf0"/>
    <rect x="14" y="30" width="36" height="22" rx="15" fill="#6d4fd6" opacity=".35"/>
    <rect x="23" y="34" width="18" height="13" rx="6.5" fill="#ffffff" opacity=".2"/>
    <circle cx="25" cy="32" r="3" fill="#fff"/><circle cx="39" cy="32" r="3" fill="#fff"/>
              <circle cx="25" cy="32.6" r="1.5" fill="#241a3d"/><circle cx="39" cy="32.6" r="1.5" fill="#241a3d"/>
    <path d="M29 41 h6" stroke="#241a3d" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32" y1="16" x2="32" y2="9" stroke="#241a3d" stroke-width="1.6" stroke-linecap="round"/>
    <circle class="tip" cx="32" cy="7.5" r="2.6" fill="#ffd166"/>
    <g class="box"><rect x="22" y="2" width="20" height="12" rx="2.5" fill="#c9a227"/>
        <path d="M22 6 h20" stroke="#8a6d16" stroke-width="1.4"/></g>
  </g>
</svg>
