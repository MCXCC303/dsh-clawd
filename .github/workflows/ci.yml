name: CI

# The plugin has no runtime dependencies and no build step, so CI is the gate
# itself: the suites, the theme contract, and the tarball a user would install.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    # A plugin verifier that waits on a timer must fail fast, not hold the job.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The Harness runs on ^22.19.0 || >=24.0.0 and a plugin never executes
        # anywhere else, so those are the only versions worth a cell.
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No `npm install`: the package declares no dependencies, and the tests
      # run on node:test. A lockfile would only add noise.

      - name: Run tests
        run: npm test

      - name: Syntax-check every entry point
        run: npm run check

      - name: Validate every theme in the tree
        run: npm run validate-theme

      - name: Pack the plugin and drive the packaged artifact
        # Packs into a scratch directory, extracts it, then drives *that* copy:
        # routes mount, a bare install falls back to a theme, every artwork file
        # serves, the client factory registers, and a traversal attempt 404s.
        run: npm run verify-package

  package:
    name: package and licensing hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show what a release would ship
        run: npm pack --dry-run

      - name: Build the code-only variant and drive it
        # Packs without `assets/themes`, then boots the extracted copy to prove a
        # theme-less install still mounts and answers.
        run: npm run pack:no-art

      - name: Refuse upstream code and artwork in the tracked tree
        # MIT covers only what this repository wrote. The state vocabulary and
        # the theme format are reimplemented from a published protocol; the
        # upstream implementation is AGPL-3.0 and its artwork is All Rights
        # Reserved, so neither may be tracked here. See README, "Licensing and
        # provenance".
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          git ls-files > tracked.txt
          grep -Eq 'local-themes|\.apng$' tracked.txt && fail 'the tracked tree contains local-only artwork'
          stray="$(grep -E '\.(svg|png|gif|jpe?g|webp|ico)$' tracked.txt | grep -vE '^assets/(themes/placeholder/|branding/)' || true)"
          [ -z "$stray" ] || fail "artwork outside the MIT themes: $stray"
          # Only the code directories: the README and this file legitimately
          # *discuss* the upstream license, a pasted source file would carry it.
          if git ls-files -z -- lib scripts test | xargs -0 grep -lE 'GNU AFFERO|AGPL-3\.0|Copyright \(C\).*clawd-on-desk' >/dev/null 2>&1; then
            fail 'AGPL-licensed source appears to be vendored under lib/, scripts/ or test/'
          fi
          echo 'the tracked tree carries only this repository own code and MIT artwork'

      - name: Refuse to ship local-only artwork
        # The artwork materialized by `setup-local-art` is All Rights Reserved
        # and must never reach a tarball; see PROVENANCE.md.
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          listing="$(tar tzf "$RUNNER_TEMP"/*.tgz)"
          if grep -Eq 'local-themes|calico|cloudling|audit\.json' <<<"$listing"; then
            echo "::error::the tarball contains files that must stay local"
            grep -E 'local-themes|calico|cloudling|audit\.json' <<<"$listing"
            exit 1
          fi
          echo "tarball carries no local-only artwork"
