name: DSH compatibility

# Which Harness releases can carry this plugin? The declaration lives in
# package.json (`dsh.engines.dsh`, `dsh.compatibility.dshReleases`); this
# workflow is what keeps it honest — one cell per declared release, each one
# installing that Harness, composing a throwaway profile with this plugin, and
# then booting it and asking the plugin's own route for an answer.
#
# The route answering 401 is the pass condition, not 200: the plugin fences
# every request with the Harness' own Host/Origin + browser-auth check, so 401
# proves the plugin is active and serving, while 404 would mean it never mounted.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: DSH ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    # Installing a Harness plus booting it is minutes of work; a hang must end
    # the cell quickly and visibly.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Every release this plugin claims to support. Older releases are
        # findings, not blockers: a red cell means the declaration must shrink,
        # never that the cell should be deleted.
        dsh: ['0.1.7-rc.1', '0.1.7-rc.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        # The Harness shells out to pnpm to install a profile's bundles.
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Harness ${{ matrix.dsh }}
        run: npm install --global "@deepseek-ai/dsh@${{ matrix.dsh }}"

      - name: Compose a throwaway profile with this plugin
        # A fresh profile starts as `@deepseek-ai/dsh-base` alone; the plugin
        # injects `webServer`, so the web carrier must be present at the same
        # exact version or the entry stays pending forever. The CLI's version
        # gate is why the version is pinned rather than left to `latest`.
        env:
          DSH_HOME: ${{ runner.temp }}/home
        run: |
          set -euo pipefail
          profile="$DSH_HOME/profiles/ci"
          policy="$profile/pnpm-workspace.yaml"
          helper="$RUNNER_TEMP/allow-builds.cjs"

          # pnpm refuses to finish while a dependency's build script is undecided
          # (`koffi`, the native FFI dependency the web carrier pulls in), and it
          # does *not* leave a placeholder behind to fix up afterwards — 11.28
          # just fails the install. The Harness reads the decision from
          # `allowBuilds` in the profile's pnpm-workspace.yaml, the same map the
          # plugin manager writes through `approvedBuilds`. This job only boots
          # the web server and never needs the native module, so the decision is
          # written once the profile's policy file exists.
          cat > "$helper" <<'JS'
          const fs = require('node:fs')
          const path = require('node:path')
          const [file, ...names] = process.argv.slice(2)
          if (names.length === 0) process.exit(0)
          fs.mkdirSync(path.dirname(file), { recursive: true })
          let text = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : ''
          if (!/^allowBuilds:/m.test(text)) text += `${text !== '' && !text.endsWith('\n') ? '\n' : ''}allowBuilds:\n`
          for (const name of names) {
            const existing = new RegExp(`^\\s+${name}:.*$`, 'm')
            text = existing.test(text)
              ? text.replace(existing, `  ${name}: false`)
              : text.replace(/^allowBuilds:\s*$/m, `allowBuilds:\n  ${name}: false`)
          }
          fs.writeFileSync(file, text)
          console.log(`declined build scripts: ${names.join(', ')}`)
          JS

          dsh --profile ci --help >/dev/null 2>&1 || true   # initializes the profile

          # Belt and braces: if a later dependency ever needs the same decision,
          # pnpm names it in the failure, so decline whatever it names and retry
          # once instead of failing the job for a policy the job does not need.
          add_bundle() {
            local out
            if out="$(dsh plugin --profile ci add "$1" 2>&1)"; then
              printf '%s\n' "$out"
              return 0
            fi
            printf '%s\n' "$out"
            local names
            names="$(printf '%s\n' "$out" | sed -n 's/.*Ignored build scripts: //p' | tr ',' '\n' | sed 's/@[^@]*$//' | tr -d ' ' | grep -v '^$' | sort -u | paste -sd' ' -)"
            if [ -z "$names" ]; then
              echo "::error::the profile install failed and pnpm named no undecided build script"
              return 1
            fi
            node "$helper" "$policy" $names
            dsh plugin --profile ci add "$1"
          }

          # Our own plugin pulls in no native dependency, and installing it first
          # is what materializes the profile's pnpm policy (packages, nodeLinker,
          # autoInstallPeers) — so the decision above lands in a file the Harness
          # itself wrote, exactly as it does when a user declines the build by
          # hand.
          add_bundle "link:$GITHUB_WORKSPACE"
          node "$helper" "$policy" koffi
          add_bundle "@deepseek-ai/dsh-web-app@${{ matrix.dsh }}"

      - name: The plugin composes into that Harness
        env:
          DSH_HOME: ${{ runner.temp }}/home
        run: |
          set -euo pipefail
          dsh --profile ci --dump-config > composed.yml
          grep -A3 '^- id: dsh-clawd$' composed.yml || {
            echo "::error::the dsh-clawd row is absent from the composed profile"
            exit 1
          }
          echo "composed against DSH ${{ matrix.dsh }}"

      - name: Boot that Harness and ask the plugin for state
        env:
          DSH_HOME: ${{ runner.temp }}/home
        run: |
          set -euo pipefail
          # `web` is the alias of `--profile web`, not a subcommand: with an
          # explicit profile the app arguments follow the profile directly.
          dsh --profile ci --no-open --port 3599 > boot.log 2>&1 &
          echo "$!" > boot.pid

          for _ in $(seq 1 60); do
            if curl -s -o /dev/null "http://127.0.0.1:3599/api/health" 2>/dev/null; then break; fi
            if grep -qiE 'listening|http://127\.0\.0\.1' boot.log; then break; fi
            sleep 1
          done
          tail -20 boot.log || true

          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3599/dsh-clawd/state.json || true)"
          kill "$(cat boot.pid)" 2>/dev/null || true
          echo "GET /dsh-clawd/state.json -> ${code}"
          case "$code" in
            401|403) echo "the plugin is mounted and fenced on DSH ${{ matrix.dsh }}" ;;
            200) echo "::warning::the route answered 200 where the fence usually answers 401; check the Host/Origin fence" ;;
            *) echo "::error::the plugin route answered ${code}: it is not serving on DSH ${{ matrix.dsh }}"; exit 1 ;;
          esac

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-${{ matrix.dsh }}-diagnostics
          path: |
            boot.log
            composed.yml
          if-no-files-found: ignore
