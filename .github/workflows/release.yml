name: Release

# A release is a tagged commit plus the tarball that tag produces. The plugin is
# consumed as a bundle (`dsh plugin --profile <name> add <tarball>`), so the
# GitHub Release is the distribution channel — there is no npm publish step.
on:
  push:
    tags: ['v*']
  # A release that failed on a step the tag cannot fix has to be re-runnable:
  # moving a published tag is worse than pressing the button again. A manual run
  # releases `v<package.json version>` from whatever ref it is dispatched on.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Gate, pack and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve the release version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag ${GITHUB_REF_NAME} matches package.json ${VERSION}"
          else
            echo "manual run on ${GITHUB_REF_NAME}: releasing v${VERSION}"
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm test

      - name: Syntax-check every entry point
        run: npm run check

      - name: Validate every theme in the tree
        run: npm run validate-theme

      - name: Pack and drive the packaged artifact
        run: npm run verify-package

      - name: Pack the release tarball
        # `npm run pack` creates dist/ first: it is git-ignored, so a fresh
        # checkout does not have it and `npm pack --pack-destination` will not
        # make it.
        run: npm run pack

      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit for both triggers: on a manual run the ref is a branch, and
          # the release still has to carry the version's tag.
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/*.tgz
            dist/SHA256SUMS.txt
          generate_release_notes: true
