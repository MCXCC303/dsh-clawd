name: Release

# A release is a tagged commit plus the tarball that tag produces. The plugin is
# consumed as a bundle (`dsh plugin --profile <name> add <tarball>`), so the
# GitHub Release is the primary distribution channel; the npm publish below is
# opt-in on NPM_TOKEN and skipped on a tag that does not have it.
on:
  push:
    tags: ['v*']
  # A release that failed on a step the tag cannot fix has to be re-runnable:
  # moving a published tag is worse than pressing the button again. A manual run
  # releases `v<package.json version>` from whatever ref it is dispatched on.
  workflow_dispatch:

permissions:
  contents: write
  # npm provenance attests the tarball to this workflow run.
  id-token: write

jobs:
  release:
    name: Gate, pack and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # Writes `.npmrc` with `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`.
          # Without this, NODE_AUTH_TOKEN alone is ignored by npm and the publish
          # silently runs unauthenticated — the same trap a developer hits when a
          # user-level .npmrc already hard-codes a token under that key.
          registry-url: https://registry.npmjs.org

      - name: Resolve the release version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag ${GITHUB_REF_NAME} matches package.json ${VERSION}"
          else
            echo "manual run on ${GITHUB_REF_NAME}: releasing v${VERSION}"
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm test

      - name: Syntax-check every entry point
        run: npm run check

      - name: Validate every theme in the tree
        run: npm run validate-theme

      - name: Pack and drive the packaged artifact
        run: npm run verify-package

      - name: Pack the release tarball
        # `npm run pack` creates dist/ first: it is git-ignored, so a fresh
        # checkout does not have it and `npm pack --pack-destination` will not
        # make it.
        run: npm run pack

      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to npm
        # Opt-in, and the gate is a shell test rather than `if: secrets...`: GitHub
        # does not expose the `secrets` context to a step-level `if`, and rejects
        # the whole workflow file when it is named there.
        #
        # The secret is a *granular* access token with "Bypass 2FA" enabled and
        # read/write on this package, because the account's auth-and-writes mode
        # makes a one-time code mandatory otherwise. `--provenance` needs the
        # id-token permission above.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::warning::repository secret NPM_TOKEN is not set — skipping the npm publish; the GitHub Release is published anyway"
            exit 0
          fi
          npm publish --provenance --access public

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit for both triggers: on a manual run the ref is a branch, and
          # the release still has to carry the version's tag.
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/*.tgz
            dist/SHA256SUMS.txt
          generate_release_notes: true
